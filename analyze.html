<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حلل سهمك الآن — مستثمرين مصريين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#061528;--sf:#0c2340;--fg:#f8f6f0;--mu:#a9b8cb;--dv:#1e3a5f;--gold:#b69a50;--up:#4fc48f;--down:#e88a91;--blue:#4aa8ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at 50% 0,#0d2a52,var(--bg) 60%);color:var(--fg);font:400 15px/1.8 Cairo,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 40px}
a{color:inherit;text-decoration:none}.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.back{display:inline-block;margin:14px 0;color:var(--mu);font-weight:700}
#brain{display:block;width:100%;height:min(46vh,330px)}
h1{text-align:center;font-size:24px;font-weight:800;margin:2px 0 4px}.sub{text-align:center;color:var(--mu);margin-bottom:16px}
.sb{position:relative}.sb input{width:100%;padding:15px 18px;font:700 16px Cairo,sans-serif;color:var(--fg);background:var(--sf);border:1.5px solid var(--dv);border-radius:16px;outline:none;box-shadow:0 0 24px #1a56c455}
.sb input:focus{border-color:var(--blue)}
#dd{position:absolute;inset-inline:0;top:100%;margin-top:6px;background:var(--sf);border:1px solid var(--dv);border-radius:14px;overflow:hidden;z-index:5;display:none;box-shadow:0 12px 30px #0008}
#dd div{padding:11px 16px;cursor:pointer;display:flex;gap:8px;justify-content:space-between}#dd div:hover,#dd div.on{background:#123055}
#dd b{font-family:ui-monospace,monospace;color:var(--gold);direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}.chips button{font:600 13px Cairo,sans-serif;color:var(--fg);background:#0c234099;border:1px solid var(--dv);border-radius:999px;padding:7px 14px;cursor:pointer}
.chips button:hover{border-color:var(--blue)}
#res{margin-top:22px}.msg{text-align:center;color:var(--mu);padding:20px}.err{color:var(--down)}
.card{background:var(--sf);border:1px solid var(--dv);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:8px;color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
.top h2{font-size:20px}.top small{color:var(--mu)}.px{font:800 30px ui-monospace,monospace;direction:ltr}
.up{color:var(--up)}.dn{color:var(--down)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g div{background:#0a1d36;border-radius:12px;padding:10px 12px}.g span{display:block;color:var(--mu);font-size:12px}.g b{font:700 17px ui-monospace,monospace;direction:ltr;display:inline-block}
.tr div{padding:6px 0;border-bottom:1px dashed var(--dv)}.tr div:last-child{border:0}
svg{width:100%;height:170px;display:block}
.btn{display:block;width:100%;text-align:center;background:linear-gradient(135deg,#b69a50,#e6c97a);color:#071d3a;font:800 17px Cairo,sans-serif;padding:14px;border-radius:14px;border:0;cursor:pointer;margin:6px 0 10px}
.dis{font-size:12px;color:var(--mu)}
.dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--blue);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-8px);opacity:.4}}
.sm{display:flex;gap:8px;margin:6px 0 10px;text-align:center}.sm div{flex:1;border-radius:12px;padding:8px;background:#0a1d36}.sm b{display:block;font:800 20px ui-monospace,monospace}
.it{width:100%;border-collapse:collapse;font-size:13px}.it td{padding:5px 4px;border-bottom:1px solid var(--dv)}.it td:nth-child(2){font-family:ui-monospace,monospace;direction:ltr;text-align:left}.it td:last-child{text-align:left;font-weight:700}
.it th{color:var(--gold);text-align:right;padding:10px 4px 3px;font-size:13px}.s-ش{color:var(--up)}.s-ب{color:var(--down)}.s-م{color:var(--mu)}.tabs{display:flex;gap:6px;margin:6px 0 10px}.tabs button{flex:1;font:700 13px Cairo,sans-serif;padding:8px 4px;border-radius:12px;border:1px solid var(--dv);background:#0a1d36;color:var(--fg);cursor:pointer}.tabs button.on{background:var(--gold);color:#071d3a;border-color:var(--gold)}</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html#technical">→ الرجوع للموقع</a>
<canvas id="brain" aria-label="مخ ذكاء اصطناعي ثلاثي الأبعاد"></canvas>
<h1>حلل سهمك الآن</h1>
<p class="sub">اكتب رمز السهم (COMI) أو اسم الشركة بالعربي</p>
<div class="sb"><input id="q" placeholder="مثال: COMI أو التجاري الدولي" autocomplete="off" enterkeyhint="search"><div id="dd"></div></div>
<div class="chips">
<button data-q="ETEL">حلل سهم المصرية للاتصالات...</button>
<button data-q="TMGH">حلل سهم مجموعة طلعت مصطفى...</button>
<button data-q="COMI">حلل سهم التجاري الدولي...</button>
<button data-q="EFID">حلل سهم إيديتا...</button>
</div>
<div id="res"></div>
</div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===== 3D brain ===== */
const cv=$('brain'),c=cv.getContext('2d'),D=Math.min(devicePixelRatio||1,2);let W,H;
function size(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();
const P=[],E=[];
for(let i=0;i<380;i++){const u=Math.random()*6.283,v=Math.acos(2*Math.random()-1);let x=Math.sin(v)*Math.cos(u),y=Math.cos(v),z=Math.sin(v)*Math.sin(u);
 const g=1+.1*Math.sin(7*u+4*v)*Math.cos(5*v);P.push({x:x*1.3*g+(x>0?.1:-.1),y:y*(y<0?.62:.9)*g,z:z*.95*g,p:Math.random()*6.28,f:0})}
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];if(Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z)<.36)E.push([i,j])}
let t=0,busy=0;
function frame(){t+=.008;c.clearRect(0,0,W,H);const sc=Math.min(W/3.3,H/2.2),cs=Math.cos(t),sn=Math.sin(t),bob=Math.sin(t*1.7)*.05;
 if(Math.random()<.35)P[Math.random()*P.length|0].f=1;
 const Q=P.map(p=>{const x=p.x*cs-p.z*sn,z=p.x*sn+p.z*cs,k=1.9/(1.9-z*.55);return{x:W/2+x*sc*k,y:H/2+(p.y+bob)*sc*k,z,k}});
 c.lineWidth=1;
 for(const[i,j]of E){const a=Q[i],b=Q[j],f=Math.max(P[i].f,P[j].f),d=(a.z+b.z)/2*.5+.5;
  c.strokeStyle=`rgba(${74+f*150|0},${168+f*60|0},255,${.07+.12*d+f*.55})`;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
 for(let i=0;i<P.length;i++){const p=P[i],q=Q[i],pu=.5+.5*Math.sin(t*5+p.p),r=(1.4+pu*.8+p.f*3)*q.k,al=.35+.25*q.z+p.f*.6;
  c.fillStyle=`rgba(${120+p.f*135|0},${200+p.f*55|0},255,${Math.min(al,1)})`;c.shadowColor='#4aa8ff';c.shadowBlur=p.f*18+4;
  c.beginPath();c.arc(q.x,q.y,r,0,6.283);c.fill();p.f*=.93}
 c.shadowBlur=0;requestAnimationFrame(frame)}
frame();
/* ===== search + autocomplete ===== */
const q=$('q'),dd=$('dd');let tm,sel=-1,items=[];
q.addEventListener('input',()=>{clearTimeout(tm);const v=q.value.trim();if(v.length<2){dd.style.display='none';return}
 tm=setTimeout(async()=>{try{items=await(await fetch('/api/suggest?q='+encodeURIComponent(v))).json()}catch(e){items=[]}
  sel=-1;dd.innerHTML=items.map((s,i)=>`<div data-i="${i}"><span>🏢 ${esc(s.name)}</span><b>${esc(s.symbol)}</b></div>`).join('');dd.style.display=items.length?'block':'none'},120)});
dd.addEventListener('click',e=>{const d=e.target.closest('[data-i]');if(d)go(items[d.dataset.i].symbol)});
q.addEventListener('keydown',e=>{const n=items.length;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+n)%n;[...dd.children].forEach((d,i)=>d.classList.toggle('on',i===sel))}
 if(e.key==='Enter'){e.preventDefault();go(dd.style.display==='block'&&sel>=0?items[sel].symbol:q.value)}});
document.addEventListener('click',e=>{if(!e.target.closest('.sb'))dd.style.display='none'});
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>go(b.dataset.q));
/* ===== analyze + render ===== */
async function go(v){v=v.trim();if(!v)return;dd.style.display='none';q.value=v;q.blur();
 $('res').innerHTML='<div class="msg"><div class="dots"><span></span><span></span><span></span></div>جارٍ تحليل السهم…</div>';
 try{const r=await fetch('/api/analyze?q='+encodeURIComponent(v)),a=await r.json();if(!r.ok)throw new Error(a.error);show(a)}
 catch(e){$('res').innerHTML=`<div class="msg err">${esc(e.message||'حدث خطأ')}</div>`}}
function chart(a){const L=[a.tp2,a.tp1,a.entry[1],a.sl,...a.hist],mx=Math.max(...L),mn=Math.min(...L),y=v=>8+(mx-v)/(mx-mn||1)*154,n=a.hist.length;
 const line=(v,col,t)=>`<line x1="0" x2="600" y1="${y(v)}" y2="${y(v)}" stroke="${col}" stroke-dasharray="5 4" opacity=".7"/><text x="598" y="${y(v)-3}" fill="${col}" font-size="11" text-anchor="end">${t} ${v}</text>`;
 return `<svg viewBox="0 0 600 170" preserveAspectRatio="none"><polyline fill="none" stroke="#4aa8ff" stroke-width="2" points="${a.hist.map((v,i)=>(i/(n-1)*600).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>${line(a.tp2,'#4fc48f','TP2')}${line(a.tp1,'#4fc48f','TP1')}${line(a.entry[1],'#e6c97a','دخول')}${line(a.sl,'#e88a91','وقف')}</svg>`}
const TL={open:'افتتاح الفترة',close:'الإغلاق',change:'التغير %',high:'الأعلى',low:'الأدنى',range_pct:'المدى %',pos:'موقع الإغلاق في النطاق %',vol_ratio:'الحجم ÷ متوسط 20',volatility:'التقلب اليومي %',max_dd:'أقصى تراجع %',gap:'فجوة الافتتاح %',candle:'الشمعة'};
function tab(k){const p=A.periods[k],m=p.summary,st=p.stats;let g='';
 let h=`<div class="tabs">${Object.entries(A.periods).map(([x,q])=>`<button class="${x===k?'on':''}" onclick="tab('${x}')">${q.label}</button>`).join('')}</div>
 <h3>الخلاصة: ${m.overall}</h3><div class="sm"><div class="up">شراء<b>${m.buy}</b></div><div class="dn">بيع<b>${m.sell}</b></div><div style="color:var(--mu)">محايد<b>${m.neutral}</b></div></div>
 <div class="g">${Object.keys(TL).filter(x=>st[x]!=null).map(x=>`<div><span>${TL[x]}</span><b style="font-family:inherit">${esc(st[x])}</b></div>`).join('')}</div><p class="dis" style="margin:8px 0">${esc(p.text)}</p>
 <div style="overflow-x:auto"><table class="it">`;
 for(const i of p.indicators){if(i.group!==g){g=i.group;h+=`<tr><th colspan="3">${esc(g)}</th></tr>`}h+=`<tr><td>${esc(i.name)}</td><td>${i.value==null?'—':i.value.toLocaleString('en',{minimumFractionDigits:2})}</td><td class="s-${i.signal[0]}">${i.signal}</td></tr>`}
 $('pc').innerHTML=h+'</table></div>'}
function show(a){const cl=a.change>=0?'up':'dn',f=v=>v==null?'—':v.toLocaleString('en',{minimumFractionDigits:2});
 $('res').innerHTML=`
 <div class="card"><div class="top"><div><h2>${esc(a.name)}</h2><small>${esc(a.symbol)}.CA · آخر جلسة ${a.date}</small></div><div><span class="px">${f(a.price)}</span> <span class="${cl}" style="direction:ltr;display:inline-block">${a.change>0?'+':''}${a.change}%</span></div></div>${chart(a)}</div>
 <div class="card"><h3>المؤشرات الفنية</h3><div class="g"><div><span>الاتجاه العام</span><b style="font-family:Cairo">${a.trend}</b></div><div><span>RSI (14)</span><b>${a.rsi}</b></div><div><span>متوسط 50 يوم</span><b>${f(a.sma50)}</b></div><div><span>متوسط 200 يوم</span><b>${f(a.sma200)}</b></div></div><p class="dis" style="margin-top:8px">${esc(a.rsi_zone)}</p></div>
 <div class="card tr"><h3>نقاط التداول</h3><div>🟢 منطقة الدخول: <b>${f(a.entry[0])} – ${f(a.entry[1])}</b> جنيه <small class="dis">(${esc(a.entry_basis)})</small></div><div>🎯 الهدف الأول: <b>${f(a.tp1)}</b></div><div>🎯 الهدف الثاني: <b>${f(a.tp2)}</b></div><div>🔴 وقف الخسارة: <b>${f(a.sl)}</b></div><div>⚖️ العائد/المخاطرة حتى الهدف الأول: <b>${a.rr}:1</b></div></div>
 <div class="card"><h3>التحليل حسب الإطار الزمني</h3><div id="pc"></div></div>
 <div class="card"><h3>القراءة الفنية — ${a.view}</h3><p>${esc(a.text)}</p></div>
 <a class="btn" href="/api/report.pdf?q=${encodeURIComponent(a.symbol)}" download>تحميل التقرير PDF 📥</a>
 <p class="dis">إخلاء مسؤولية: التقرير مُولَّد آليًا لأغراض استرشادية وتحليلية فقط ولا يُعد توصية مباشرة بالشراء أو البيع.</p>`;
 window.A=a;tab('year');
 $('res').scrollIntoView({behavior:'smooth'})}
</script>
</body>
</html>
